# odoo20iot 开发栈（Phase 0 最小集）
#
# 范围：只跑 IoT 平台依赖的中间件。
#       Odoo 20 不在此栈内 —— 它由 devbox 容器提供，本栈通过
#       http://100.64.0.3:9070 访问（devbox 内为 127.0.0.1:8070）。
#
# 端口：全部落在 28xxx 段，避开宿主已占用端口：
#       80/443 dify-nginx · 3001 grafana · 3002 uptime-kuma · 5678 n8n
#       8060 mon-alert-wecom · 9090 prometheus · 9093 alertmanager
#       9069/9070/9072/9073 devbox Odoo · 9910/9920 cc-connect · 2222 devbox ssh
#
# 监听地址统一绑定 Tailscale IP 100.64.0.3，沿用 devbox 的安全基线
# （局域网 192.168.127.163 上不暴露）。副作用：Tailscale 未启动时本栈无法启动。
#
# MinIO 未纳入本阶段：Phase 0 无对象存储需求（归档 / OTA 在 Phase 3），
# 且 MinIO 上游镜像许可与分发策略有变更，届时单独评估（ADR-010）。

name: odoo20iot

services:
  postgres:
    image: postgres:18-alpine
    container_name: iot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iot_migrator
      POSTGRES_PASSWORD: iot_migrator_dev_only_change_me
      POSTGRES_DB: odoo20iot
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      TZ: UTC
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      # 审计与对账依赖时间序，统一 UTC 存储
      - -c
      - timezone=UTC
    ports:
      - "100.64.0.3:28543:5432"
    volumes:
      # PostgreSQL 18+ 官方镜像改变了数据目录约定：
      #   PGDATA=/var/lib/postgresql/18/docker，挂载点必须是 /var/lib/postgresql。
      # 若仍挂到 /var/lib/postgresql/data，镜像会判定为「未使用的挂载」并拒绝启动（无限重启）。
      - pg-data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_migrator -d odoo20iot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: iot-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - ""
    ports:
      - "100.64.0.3:28637:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  nats:
    image: nats:2-alpine
    container_name: iot-nats
    restart: unless-stopped
    command:
      - --jetstream
      - --store_dir
      - /data
      - --http_port
      - "8222"
      - --name
      - iot-nats-1
    ports:
      - "100.64.0.3:28222:4222"
      - "100.64.0.3:28224:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12

  greptimedb:
    image: greptime/greptimedb:latest
    container_name: iot-greptimedb
    restart: unless-stopped
    # GreptimeDB standalone 默认只绑定 127.0.0.1，容器内必须显式绑 0.0.0.0，
    # 否则 Docker 端口发布不可达。注意迷惑性：容器自带健康检查走 loopback 仍然通过，
    # 表现为「容器 healthy 但外部连不上」。以下是本次实测踩到的坑。
    command:
      - standalone
      - start
      - --data-home
      - /data
      - --http-addr
      - 0.0.0.0:4000
      - --rpc-addr
      - 0.0.0.0:4001
      - --mysql-addr
      - 0.0.0.0:4002
      - --postgres-addr
      - 0.0.0.0:4003
    ports:
      - "100.64.0.3:28400:4000"   # HTTP API
      - "100.64.0.3:28401:4001"   # gRPC
      - "100.64.0.3:28403:4003"   # PostgreSQL wire（首选：纯 Go pgx，无 cgo，见 ADR-010）
    volumes:
      - greptime-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pg-data:
  redis-data:
  nats-data:
  greptime-data:
